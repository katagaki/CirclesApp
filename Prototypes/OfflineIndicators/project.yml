name: OfflineIndicators
options:
  bundleIdPrefix: com.tsubuzaki.prototype
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
targets:
  OfflineIndicators:
    type: application
    platform: iOS
    sources:
      - OfflineIndicators
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsubuzaki.prototype.OfflineIndicators
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Offline Indicators
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
