name: Build and Deploy to Play Store

on:
  push:
    branches:
      - main
    paths:
      - 'Android/**'
      - '!Android/README.md'
      - '.github/workflows/android-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy to internal track
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JetBrains Runtime 21 (Gradle daemon)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create OpenID.json
        run: echo '${{ secrets.OPENID_JSON }}' > app/src/main/assets/OpenID.json

      - name: Create Relays.json
        run: echo '${{ secrets.RELAYS_JSON }}' > app/src/main/assets/Relays.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/keystore.jks

      - name: Create local.properties
        run: |
          cat <<EOF > local.properties
          signing.storeFile=${{ runner.temp }}/keystore.jks
          signing.storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          signing.keyAlias=${{ secrets.KEY_ALIAS }}
          signing.keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # Run numbers restarted when this workflow moved from CirclesGo, whose last upload was run 41
      - name: Build release AAB
        run: >
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 41))
          ./gradlew bundleRelease
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          -Porg.gradle.java.installations.auto-download=false

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tsubuzaki.circlesgo
          releaseFiles: Android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed